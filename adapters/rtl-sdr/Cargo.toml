[package]
name = "orclink-adapter-rtl-sdr"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
orclink-protocol = { path = "../../crates/orclink-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
