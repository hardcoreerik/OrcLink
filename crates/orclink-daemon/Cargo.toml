[package]
name = "orclink-daemon"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "orclinkd"
path = "src/main.rs"

[dependencies]
orclink-protocol = { path = "../orclink-protocol" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tiny_http = "0.12"
